name: CI - Fiscal Insights Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint, Test, Build & E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all workspace packages
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run Tax Engine Test Vectors (100% CI Gate)
        run: pnpm --filter @fiscal-insights/tax-engine test

      - name: Build Tax Packages
        run: |
          pnpm --filter @fiscal-insights/tax-data build
          pnpm --filter @fiscal-insights/tax-engine build

      - name: Build Next.js Web App
        run: pnpm --filter web build

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
